[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iiko-api-sample"
version = "0.1.0"
description = "Sample Python project for exploring the iiko API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
iiko-api-sample = "iiko_api_sample.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
